name: telegram-ai-analytics-platform

x-service-defaults: &service-defaults
  restart: unless-stopped
  labels:
    logging_enabled: "true"
    logging_app: telegram-ai-analytics-platform
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres-vectors:
    <<: *service-defaults
    image: pgvector/pgvector:0.8.5-pg16-bookworm@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_DB: ${AI_BRAIN_POSTGRES_DB:-chat_history}
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-chatbot-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 15

  telegram-mock:
    <<: *service-defaults
    build:
      context: ./telegram-mock
      dockerfile: Dockerfile
    image: telegram-ai-analytics/telegram-mock:local
    environment:
      API_KEY: ${TELEGRAM_API_KEY:-local-telegram-adapter-key-change-me}
      TELEGRAM_TENANT_SIGNING_KEY: ${TELEGRAM_TENANT_SIGNING_KEY:-local-telegram-tenant-signing-key-change-me}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${TELEGRAM_MOCK_PORT:-8010}:8010"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10

  ai_brain:
    <<: *service-defaults
    build:
      context: ../ai_brain
      dockerfile: Dockerfile
    image: telegram-ai-analytics/ai-brain:local
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${AI_BRAIN_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_KEY: ${AI_BRAIN_API_KEY:-local-ai-brain-key-change-me}
      HOST: 0.0.0.0
      PORT: "8000"
      POSTGRES_HOST: postgres-vectors
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${AI_BRAIN_POSTGRES_DB:-chat_history}
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-chatbot-password}
      MODEL_HISTORY_LIMIT: ${MODEL_HISTORY_LIMIT:-50}
      API_HISTORY_MAX_LIMIT: ${API_HISTORY_MAX_LIMIT:-1000}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-openai-key-not-configured}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.2}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-1200}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CHECKPOINT_BACKEND: ${CHECKPOINT_BACKEND:-postgres}
      ALLOW_MEMORY_CHECKPOINT_FALLBACK: ${ALLOW_MEMORY_CHECKPOINT_FALLBACK:-false}
      CHANNEL_SEARCH_URL: ${CHANNEL_SEARCH_URL:-http://telegram-mock:8010/api/channel-search}
      CHANNEL_SEARCH_API_KEY: ${CHANNEL_SEARCH_API_KEY:-local-telegram-adapter-key-change-me}
      TELEGRAM_API_URL: ${TELEGRAM_ADAPTER_URL:-http://telegram-mock:8010}
      TELEGRAM_API_KEY: ${TELEGRAM_API_KEY:-local-telegram-adapter-key-change-me}
      REPOST_TOOL_PATH: ${REPOST_TOOL_PATH:-}
      REPOST_CONFIG_DIR: ${REPOST_CONFIG_DIR:-}
      REPOST_INPUT_DIR: ${REPOST_INPUT_DIR:-}
      REPOST_IDEMPOTENCY_DB: ${REPOST_IDEMPOTENCY_DB:-}
      REPOST_CONFIRMATION_SECRET: ${REPOST_CONFIRMATION_SECRET:-}
    depends_on:
      postgres-vectors:
        condition: service_healthy
      telegram-mock:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  auth-backend:
    <<: *service-defaults
    build:
      context: ../auth-backend
      dockerfile: Dockerfile
    image: telegram-ai-analytics/auth-backend:local
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${AUTH_BACKEND_PORT:-8001}:8000"
    volumes:
      - ./demo-data:/app/demo-data:ro
    environment:
      APP_ENV: ${ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-jwt-secret-change-me-minimum-32-chars}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_HOURS: "24"
      DEFAULT_USERNAME: ${DEFAULT_USERNAME:-demo}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-demo-password-change-me}
      DEFAULT_PASSWORD_HASH: ${DEFAULT_PASSWORD_HASH:-}
      DASHBOARD_DATA_SOURCE: ${DASHBOARD_DATA_SOURCE:-synthetic-demo}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:7777,http://localhost:8080}
      API_V1_PREFIX: /api
      PARSER_LOGS_DIR: /app/demo-data
      AI_BRAIN_URL: http://ai_brain:8000
      AI_BRAIN_API_KEY: ${AI_BRAIN_API_KEY:-local-ai-brain-key-change-me}
      TELEGRAM_API_KEY: ${TELEGRAM_API_KEY:-local-telegram-adapter-key-change-me}
      TELEGRAM_TENANT_SIGNING_KEY: ${TELEGRAM_TENANT_SIGNING_KEY:-local-telegram-tenant-signing-key-change-me}
      LOGIN_CLIENT_SIGNING_KEY: ${LOGIN_CLIENT_SIGNING_KEY:-local-login-client-signing-key-change-me}
      TELEGRAM_CHATBOT_URL: ${TELEGRAM_ADAPTER_URL:-http://telegram-mock:8010}
    depends_on:
      ai_brain:
        condition: service_healthy
      telegram-mock:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10

  frontend-new:
    <<: *service-defaults
    build:
      context: ../frontend-new
      dockerfile: Dockerfile
    image: telegram-ai-analytics/frontend:local
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-7777}:7777"
    environment:
      NODE_ENV: production
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: "7777"
      HOSTNAME: 0.0.0.0
      AUTH_BACKEND_URL: http://auth-backend:8000/api
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-http://localhost:7777}
      LOGIN_CLIENT_SIGNING_KEY: ${LOGIN_CLIENT_SIGNING_KEY:-local-login-client-signing-key-change-me}
      DASHBOARD_DATA_SOURCE: ${DASHBOARD_DATA_SOURCE:-synthetic-demo}
    depends_on:
      auth-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:7777"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  api-proxy:
    <<: *service-defaults
    image: nginx:1.30.3-alpine@sha256:0d3b80406a13a767339fbe2f41406d6c7da727ab89cf8fae399e81f780f814d1
    profiles: ["gateway"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./api/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend-new:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  loki:
    <<: *service-defaults
    image: grafana/loki:3.7.3@sha256:70b9f699fc9bb868b62f1cfd4f787dfa50242f1fd92e6089787d5d7daea75fe8
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ../monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    profiles: ["observability"]
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      NETWORKS: "1"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-observability
    read_only: true
    tmpfs:
      - /run:size=4m,mode=0755
      - /tmp:size=4m,mode=1777
      - /var/lib/haproxy:size=4m,mode=0755
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  alloy:
    <<: *service-defaults
    image: grafana/alloy:v1.17.1@sha256:4f6ddc56ffdcf8a6316748fc5162972e20cb301523cac1bb4a31957df733ae9b
    profiles: ["observability"]
    command:
      - run
      - --disable-reporting
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - default
      - docker-observability
    depends_on:
      loki:
        condition: service_started
      docker-socket-proxy:
        condition: service_healthy

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    profiles: ["observability"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    <<: *service-defaults
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    profiles: ["observability"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-password-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started

volumes:
  postgres_data:
  loki_data:
  prometheus_data:
  grafana_data:
  alloy_data:

networks:
  docker-observability:
    internal: true
