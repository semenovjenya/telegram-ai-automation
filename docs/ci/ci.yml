name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.lock

      - name: Install repository-check dependencies
        run: >-
          python -m pip install
          --require-hashes
          --requirement requirements-test.lock

      - name: Validate public repository tree
        run: python .github/scripts/repository_guard.py

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          ai_brain auth-backend compose/telegram-mock parser_local tests .github/scripts

      - name: Lint Python sources
        run: >-
          ruff check
          ai_brain auth-backend compose/telegram-mock parser_local tests .github/scripts

      - name: Check Python formatting
        run: >-
          ruff format --check
          ai_brain auth-backend compose/telegram-mock parser_local tests .github/scripts

      - name: Validate default Compose stack
        run: >-
          docker compose
          --env-file compose/env/.env.example
          -f compose/docker-compose.yml
          config --quiet

      - name: Validate optional Compose profiles
        run: >-
          docker compose
          --env-file compose/env/.env.example
          -f compose/docker-compose.yml
          --profile gateway
          --profile observability
          config --quiet

      - name: Validate development override
        run: >-
          docker compose
          --env-file compose/env/.env.example
          -f compose/docker-compose.yml
          -f compose/compose.override.yml
          config --quiet

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai_brain/requirements.lock
            requirements-test.lock

      - name: Install application and test dependencies
        run: >-
          python -m pip install
          --require-hashes
          --requirement requirements-test.lock

      - name: Run unit tests with coverage
        run: >-
          pytest -q
          --cov=ai_brain.api
          --cov=ai_brain.clients.postgres_client
          --cov=ai_brain.config
          --cov=ai_brain.graph
          --cov=ai_brain.nodes.memory_nodes
          --cov=ai_brain.nodes.router_node
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=70

  frontend:
    name: Frontend lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-new
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test BFF and browser security boundaries
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  dependency-audit:
    name: Python dependency audit (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: ai-brain
            requirements: ai_brain/requirements.lock
          - component: auth-backend
            requirements: auth-backend/requirements.lock
          - component: parser-local
            requirements: parser_local/requirements.lock
          - component: parser-ml
            requirements: parser_local/ML/requirements.lock
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.requirements }}
            requirements-audit.lock

      - name: Audit declared dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --requirement requirements-audit.lock
          python -m pip_audit --requirement "${{ matrix.requirements }}"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate

  container-builds:
    name: Container build (${{ matrix.image }})
    needs: [repository-quality, python-tests, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ai-brain
            context: ai_brain
            dockerfile: ai_brain/Dockerfile
          - image: auth-backend
            context: auth-backend
            dockerfile: auth-backend/Dockerfile
          - image: frontend
            context: frontend-new
            dockerfile: frontend-new/Dockerfile
          - image: telegram-mock
            context: compose/telegram-mock
            dockerfile: compose/telegram-mock/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: local/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Reject high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: local/${{ matrix.image }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: table

  core-smoke:
    name: Core Compose smoke test
    needs: [container-builds, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build and start the zero-credential stack
        run: >-
          docker compose
          --env-file compose/env/.env.example
          -f compose/docker-compose.yml
          up --build --detach --wait --wait-timeout 180

      - name: Exercise the browser BFF, auth, data, AI, and persistence paths
        run: python .github/scripts/smoke_test.py

      - name: Print service logs on failure
        if: failure()
        run: >-
          docker compose
          --env-file compose/env/.env.example
          -f compose/docker-compose.yml
          logs --no-color --tail=300

      - name: Tear down the ephemeral stack
        if: always()
        run: >-
          docker compose
          --env-file compose/env/.env.example
          -f compose/docker-compose.yml
          down --volumes --remove-orphans

  ci-success:
    name: CI success
    if: always()
    needs:
      - repository-quality
      - python-tests
      - frontend
      - dependency-audit
      - dependency-review
      - container-builds
      - core-smoke
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      REPOSITORY_QUALITY_RESULT: ${{ needs.repository-quality.result }}
      PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
      DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
      CONTAINER_BUILDS_RESULT: ${{ needs.container-builds.result }}
      CORE_SMOKE_RESULT: ${{ needs.core-smoke.result }}
    steps:
      - name: Require every mandatory CI result
        shell: bash
        run: |
          failed=()
          for check in \
            REPOSITORY_QUALITY_RESULT \
            PYTHON_TESTS_RESULT \
            FRONTEND_RESULT \
            DEPENDENCY_AUDIT_RESULT \
            CONTAINER_BUILDS_RESULT \
            CORE_SMOKE_RESULT
          do
            if [[ "${!check}" != "success" ]]; then
              failed+=("${check}=${!check}")
            fi
          done

          if [[ "$DEPENDENCY_REVIEW_RESULT" != "success" ]]; then
            if [[ "$EVENT_NAME" == "pull_request" || "$DEPENDENCY_REVIEW_RESULT" != "skipped" ]]; then
              failed+=("DEPENDENCY_REVIEW_RESULT=$DEPENDENCY_REVIEW_RESULT")
            fi
          fi

          if (( ${#failed[@]} > 0 )); then
            printf 'Mandatory CI checks did not succeed:\n'
            printf ' - %s\n' "${failed[@]}"
            exit 1
          fi

          echo "All mandatory CI checks succeeded."
