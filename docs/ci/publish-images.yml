name: Publish container images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Validate exact release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require tag vVERSION
        id: release
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 .github/scripts/validate_release_tag.py \
            --version-file VERSION \
            --ref-type "$RELEASE_REF_TYPE" \
            --ref-name "$RELEASE_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --main-ref refs/remotes/origin/main
          version="$(tr -d '\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verification:
    name: Run complete CI verification
    needs: release-metadata
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.image }}
    needs: [release-metadata, verification]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ai-brain
            context: ai_brain
            dockerfile: ai_brain/Dockerfile
          - image: auth-backend
            context: auth-backend
            dockerfile: auth-backend/Dockerfile
          - image: frontend
            context: frontend-new
            dockerfile: frontend-new/Dockerfile
          - image: telegram-mock
            context: compose/telegram-mock
            dockerfile: compose/telegram-mock/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && github.ref_name == format('v{0}', needs.release-metadata.outputs.version) }}

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
